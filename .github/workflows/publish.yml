name: publish-images
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    # Keep publication fail-closed until the application copyright holders
    # provide a license grant and a maintainer records that approval.
    if: startsWith(github.ref, 'refs/tags/v') && vars.DVCS_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
          - variant: cuda12.6
            torch_index: https://download.pytorch.org/whl/cu126
          - variant: jlab_ifarm
            torch_index: https://download.pytorch.org/whl/cu126
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          REGISTRY_REPOSITORY: ghcr.io/${{ github.repository_owner }}/extract-dvcs-gpd
          VARIANT: ${{ matrix.variant }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${VARIANT}" == jlab_ifarm ]]; then
            tag="${REGISTRY_REPOSITORY}:jlab_ifarm-${version}"
          else
            tag="${REGISTRY_REPOSITORY}:${version}-${VARIANT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: containers/Dockerfile
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            IMAGE_VERSION=${{ steps.image.outputs.version }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/extract-dvcs-gpd
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

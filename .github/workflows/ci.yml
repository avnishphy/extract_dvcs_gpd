name: cpu-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: ./tests/run.sh static
  cpu-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: containers/Dockerfile
          target: runtime
          load: true
          tags: extract-dvcs-gpd:ci-cpu
          build-args: |
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
      - run: docker run --rm extract-dvcs-gpd:ci-cpu partons-bridge --self-test
      - run: docker run --rm extract-dvcs-gpd:ci-cpu shell -lc 'python -c "import torch,sbi,extract_dvcs_cff; assert not torch.cuda.is_available()" && pip check'
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: extract-dvcs-gpd:ci-cpu
          fail-build: true
          severity-cutoff: high
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: extract-dvcs-gpd:ci-cpu
          format: spdx-json
          output-file: sbom-cpu.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpu-sbom
          path: sbom-cpu.spdx.json
